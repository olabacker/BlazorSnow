name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ./src/BlazorSnow.sln

      - name: Build
        run: dotnet build ./src/BlazorSnow.sln --configuration Release --no-restore

      - name: Pack (sanity check)
        run: dotnet pack ./src/BlazorSnow.csproj --configuration Release --no-build
